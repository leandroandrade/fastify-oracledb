services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: oracle-free
    ports:
      - "1521:1521"
    environment:
      - APP_USER_PASSWORD=oracle
      - APP_USER=oracle
      - ORACLE_PASSWORD=oracle
    volumes:
      - storage:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20

networks:
  default:
    driver: bridge

volumes:
  storage:
